<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASFA Docs</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1769e8;--ink:#26334a;--line:#dfe7f2}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{color:var(--blue);font-weight:800;text-decoration:none;font-size:18px}.actions,.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.btn,.toolbar button,.toolbar select{background:#fff;border:1px solid #dce4f0;border-radius:8px;padding:8px 11px;color:#34435a;font-size:13px}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}button:hover{filter:brightness(.97)}.page{max-width:1120px;margin:20px auto;padding:0 14px}.docrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.title{flex:1;min-width:190px;border:1px solid transparent;background:transparent;font-size:22px;font-weight:bold;padding:9px;border-radius:8px}.title:focus{background:white;border-color:#b8d0f8;outline:none}.picker{min-width:190px;border:1px solid var(--line);border-radius:8px;padding:9px;background:white}.toolbar{background:white;border:1px solid var(--line);border-radius:12px 12px 0 0;padding:9px}.toolbar button{padding:7px 9px;min-height:34px}.toolbar select{height:34px;max-width:145px;padding:0 7px}.toolbar input{height:34px;width:36px}.editor-shell{padding:22px;background:#e9eef6;border:1px solid var(--line);border-top:0;min-height:650px}#editor{width:min(100%,790px);min-height:850px;margin:auto;padding:65px 70px;background:white;outline:none;box-shadow:0 3px 15px #22334d0b;font-size:16px;line-height:1.8;overflow-wrap:anywhere}#editor p{margin:0 0 12px}#editor table{border-collapse:collapse;width:100%;margin:12px 0}#editor td{border:1px solid #aab8ca;padding:7px;min-width:35px}#editor img{max-width:100%;height:auto}.status{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;color:#77849a;font-size:12px}#status.error{color:#c13956}#notice{display:none;background:#fff8e7;border:1px solid #f0dfad;padding:11px;border-radius:8px;margin-bottom:10px;font-size:13px}#notice a{color:var(--blue)}@media(max-width:650px){.top{padding:10px}.page{margin:10px auto;padding:0 7px}.actions{gap:4px}.btn{padding:7px;font-size:12px}.editor-shell{padding:7px}#editor{padding:25px 18px;min-height:650px}.title{font-size:18px}}@media print{body{background:white}.top,.docrow,.toolbar,.status,#notice{display:none!important}.page{margin:0;padding:0}.editor-shell{padding:0;background:white;border:0}#editor{box-shadow:none;padding:0;min-height:0;width:100%}}
</style></head><body>
<header class="top"><a class="brand" href="../index.html">△ ASFA Docs</a><div class="actions">
<button class="btn" id="new">새 문서</button><button class="btn" id="save">클라우드 저장</button><button class="btn" id="html">HTML 내보내기</button><button class="btn" id="txt">TXT 내보내기</button><button class="btn primary" id="pdf">인쇄 / PDF</button><a href="../index.html"><button class="btn">홈</button></a></div></header>
<main class="page"><div id="notice">클라우드 저장은 <a href="../index.html">ASFA 홈에서 Google 로그인</a>한 뒤 사용할 수 있습니다.</div>
<div class="docrow"><input id="title" class="title" value="제목 없는 문서" maxlength="180" aria-label="문서 제목"><select id="picker" class="picker"><option value="">저장된 문서 불러오기</option></select></div>
<div class="toolbar" id="toolbar">
<button type="button" data-cmd="undo" title="실행 취소">↶</button><button type="button" data-cmd="redo" title="다시 실행">↷</button>
<select id="block" aria-label="문단 스타일"><option value="P">본문</option><option value="H1">제목 1</option><option value="H2">제목 2</option><option value="H3">제목 3</option><option value="BLOCKQUOTE">인용문</option></select>
<select id="font" aria-label="글꼴"><option>Arial</option><option>Noto Sans KR</option><option>Georgia</option><option>Courier New</option></select>
<select id="size" aria-label="글자 크기"><option value="2">작게</option><option value="3" selected>보통</option><option value="4">크게</option><option value="5">아주 크게</option><option value="6">제목 크기</option></select>
<button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><input id="color" type="color" value="#26334a" title="글자 색">
<button data-cmd="justifyLeft">왼쪽</button><button data-cmd="justifyCenter">가운데</button><button data-cmd="justifyRight">오른쪽</button><button data-cmd="insertUnorderedList">• 목록</button><button data-cmd="insertOrderedList">1. 목록</button><button id="link">링크</button><button id="table">표</button><button id="image">이미지</button><input id="imagefile" type="file" accept="image/*" hidden></div>
<div class="editor-shell"><article id="editor" contenteditable="true" spellcheck="true"><h1>문서 제목</h1><p>여기에 내용을 입력하세요.</p></article></div>
<div class="status"><span id="status" role="status">준비됨</span><span id="count">0자</span></div></main>
<script>
(()=>{const URL='https://mujmwouyopgxwtezhlzv.supabase.co',KEY='sb_publishable_uiChi46cHC53f6QAm8TALQ_MGknEOQ9';const db=window.supabase.createClient(URL,KEY),ed=document.getElementById('editor'),title=document.getElementById('title'),status=document.getElementById('status'),picker=document.getElementById('picker'),notice=document.getElementById('notice');let user=null,id=null,dirty=false,saving=false,timer=null,range=null;
function msg(s,err=false){status.textContent=s;status.classList.toggle('error',err)}function count(){status.nextElementSibling.textContent=(ed.innerText||'').length+'자'}function remember(){let s=getSelection();if(s&&s.rangeCount&&ed.contains(s.anchorNode))range=s.getRangeAt(0).cloneRange()}function focusEditor(){ed.focus();let s=getSelection();if(range&&s){s.removeAllRanges();s.addRange(range)}}
ed.addEventListener('mouseup',remember);ed.addEventListener('keyup',remember);function changed(){dirty=true;count();msg('수정됨 · 자동 저장 대기 중');schedule()}ed.addEventListener('input',changed);title.addEventListener('input',changed);
document.querySelectorAll('[data-cmd]').forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>{focusEditor();document.execCommand(b.dataset.cmd,false,null);remember();changed()})});
document.getElementById('block').onchange=e=>{focusEditor();document.execCommand('formatBlock',false,'<'+e.target.value+'>');remember();changed()};document.getElementById('font').onchange=e=>{focusEditor();document.execCommand('fontName',false,e.target.value);remember();changed()};document.getElementById('size').onchange=e=>{focusEditor();document.execCommand('fontSize',false,e.target.value);remember();changed()};document.getElementById('color').oninput=e=>{focusEditor();document.execCommand('foreColor',false,e.target.value);remember();changed()};
document.getElementById('link').onclick=()=>{let u=prompt('링크 주소 (https://...)');if(!u)return;try{let x=new URL(u);if(!['http:','https:'].includes(x.protocol))throw 0;focusEditor();document.execCommand('createLink',false,x.href);remember();changed()}catch{alert('http:// 또는 https:// 주소를 입력해 주세요.')}};
document.getElementById('table').onclick=()=>{let r=+prompt('행 수 (1~20)','3'),c=+prompt('열 수 (1~12)','3');if(!Number.isInteger(r)||!Number.isInteger(c)||r<1||r>20||c<1||c>12){alert('행 1~20, 열 1~12 사이로 입력하세요.');return}let t=document.createElement('table'),b=document.createElement('tbody');for(let i=0;i<r;i++){let tr=document.createElement('tr');for(let j=0;j<c;j++){let td=document.createElement('td');td.innerHTML='&nbsp;';tr.append(td)}b.append(tr)}t.append(b);focusEditor();if(range&&ed.contains(range.commonAncestorContainer)){range.deleteContents();range.insertNode(t)}else ed.append(t);let p=document.createElement('p');p.innerHTML='<br>';t.after(p);remember();changed()};
document.getElementById('image').onclick=()=>document.getElementById('imagefile').click();document.getElementById('imagefile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>3*1024*1024){alert('이미지 파일 3MB 이하를 선택해 주세요.');return}let rd=new FileReader();rd.onload=()=>{let im=document.createElement('img');im.src=rd.result;im.alt=f.name;focusEditor();if(range&&ed.contains(range.commonAncestorContainer)){range.deleteContents();range.insertNode(im)}else ed.append(im);remember();changed()};rd.readAsDataURL(f);e.target.value=''};
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name.replace(/[\\/:*?"<>|]/g,'_');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.getElementById('html').onclick=()=>{let safe=title.value.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));download((title.value||'ASFA 문서')+'.html','<!doctype html><html lang="ko"><meta charset="utf-8"><title>'+safe+'</title><style>body{font:16px/1.8 Arial,sans-serif;max-width:800px;margin:40px auto}table{border-collapse:collapse;width:100%}td{border:1px solid #aaa;padding:7px}img{max-width:100%}</style><body>'+ed.innerHTML+'</body></html>','text/html;charset=utf-8');msg('HTML 파일을 내보냈습니다.')};
document.getElementById('txt').onclick=()=>{download((title.value||'ASFA 문서')+'.txt',ed.innerText,'text/plain;charset=utf-8');msg('TXT 파일을 내보냈습니다.')};document.getElementById('pdf').onclick=()=>print();
document.getElementById('new').onclick=()=>{if(dirty&&!confirm('저장하지 않은 내용이 있을 수 있습니다. 새 문서를 만들까요?'))return;id=null;picker.value='';title.value='제목 없는 문서';ed.innerHTML='<h1>문서 제목</h1><p>여기에 내용을 입력하세요.</p>';dirty=false;count();msg('새 문서입니다. 저장 버튼을 눌러 클라우드에 저장하세요.')};
async function list(){if(!user)return;let {data,error}=await db.from('asfa_docs').select('id,title,updated_at').eq('user_id',user.id).order('updated_at',{ascending:false});if(error){msg('문서 목록 오류: '+error.message,true);return}picker.replaceChildren(new Option('저장된 문서 불러오기',''));(data||[]).forEach(d=>picker.add(new Option(d.title||'제목 없는 문서',d.id)))}
async function loadDoc(docid){if(!docid||!user)return;if(dirty&&!confirm('저장되지 않은 내용이 있을 수 있습니다. 문서를 바꿀까요?')){picker.value=id||'';return}let {data,error}=await db.from('asfa_docs').select('id,title,content').eq('id',docid).eq('user_id',user.id).single();if(error){msg('불러오기 실패: '+error.message,true);return}id=data.id;title.value=data.title||'제목 없는 문서';ed.innerHTML=data.content||'<p></p>';dirty=false;count();msg('클라우드에서 문서를 불러왔습니다.')}
picker.onchange=()=>loadDoc(picker.value);
async function save(){if(!user){notice.style.display='block';msg('클라우드 저장은 Google 로그인 후 사용할 수 있습니다.',true);return}if(saving)return;saving=true;let b=document.getElementById('save');b.disabled=true;b.textContent='저장 중…';let payload={user_id:user.id,title:title.value.trim()||'제목 없는 문서',content:ed.innerHTML,updated_at:new Date().toISOString()},res=id?await db.from('asfa_docs').update(payload).eq('id',id).eq('user_id',user.id).select('id').single():await db.from('asfa_docs').insert(payload).select('id').single();saving=false;b.disabled=false;b.textContent='클라우드 저장';if(res.error){console.error(res.error);msg('저장 실패: '+res.error.message,true);return}id=res.data.id;dirty=false;await list();picker.value=id;msg('클라우드에 저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}))}
document.getElementById('save').onclick=save;function schedule(){clearTimeout(timer);if(user)timer=setTimeout(()=>{if(dirty)save()},2000)}
picker.addEventListener('change',()=>{});async function init(){let {data,error}=await db.auth.getSession();if(error){msg('로그인 확인 오류: '+error.message,true);return}user=data.session?.user||null;if(user){notice.style.display='none';await list();msg('로그인됨 · 변경 내용은 자동 저장되며 저장 버튼으로도 저장할 수 있습니다.')}else{notice.style.display='block';msg('로그인 전: 편집 및 파일 내보내기 가능 · 클라우드 저장은 로그인 후 사용')}count()}
db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user){notice.style.display='none';list()}else{notice.style.display='block';picker.replaceChildren(new Option('저장된 문서 불러오기',''));}});init();
})();
</script></body></html>
